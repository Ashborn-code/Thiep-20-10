<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thiệp chúc mừng 20/10</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<button id="cover" aria-label="Mở thiệp">
  <span class="env">💌</span>
  <span class="t">Chạm để mở thiệp</span>
</button>

<main id="card" aria-live="polite">
  <div class="inner p-hoa" id="inner">
    <p class="date">20/10</p>
    <h1>Chúc mừng Ngày Phụ nữ Việt Nam</h1>
    <p class="to" id="outTo"></p>
    <p class="msg" id="outMsg"></p>
    <p class="sig" id="outFrom"></p>
  </div>
</main>

<button id="toggle">✏️ Chỉnh thiệp</button>

<section id="panel" aria-label="Chỉnh thiệp">
  <label for="inTo">Gửi tới</label>
  <input id="inTo" value="Mẹ yêu">
  <label for="inMsg">Lời chúc</label>
  <textarea id="inMsg" rows="5">Chúc mẹ luôn mạnh khỏe, bình an và hạnh phúc. Cảm ơn mẹ vì tất cả tình yêu thương và những điều tốt đẹp mẹ đã dành cho con. Con mong mẹ luôn vui vẻ mỗi ngày!</textarea>
  <label for="inFrom">Người gửi</label>
  <input id="inFrom" value="Con của mẹ">
  <label>Họa tiết</label>
  <div class="row" id="pats">
    <button data-p="p-hoa" aria-pressed="true">Hoa</button>
    <button data-p="p-cham" aria-pressed="false">Chấm</button>
    <button data-p="p-soc" aria-pressed="false">Sọc</button>
    <button data-p="p-caro" aria-pressed="false">Caro</button>
  </div>
  <label>Cánh rơi</label>
  <div class="row" id="emos">
    <button data-e="🌸" aria-pressed="true">🌸</button>
    <button data-e="🌹" aria-pressed="false">🌹</button>
    <button data-e="💖" aria-pressed="false">💖</button>
    <button data-e="✨" aria-pressed="false">✨</button>
  </div>
</section>

<script src="script.js"></script>
</body>
</html>
